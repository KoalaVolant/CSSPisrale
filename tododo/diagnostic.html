<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo Quest - Diagnostic PC V78.0 RC</title><style>body{font:16px system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 16px;line-height:1.5}h1{font-size:1.4rem}li{margin:8px 0} .ok{color:#15704a}.fail{color:#ad2828} .note{color:#555}button{padding:10px 16px;font:inherit}</style></head><body><h1>Diagnostic Todo Quest <small>PC V78.0 RC</small></h1><p>Vérification en lecture seule des fichiers hébergés. Aucune donnée personnelle n'est lue ni envoyée.</p><p id="status">Contrôle en cours…</p><ul id="results"></ul><button id="copy" type="button">Copier le résultat</button><p class="note">Une vérification de fichiers réussie ne prouve pas le fonctionnement de Firebase ni la synchronisation simultanée.</p><script>
const ASSETS=["./index.html", "./firebase-config.js", "./sync-merge-v72.js", "./js/01-core.js", "./js/02-catalogue.js", "./js/03-storage.js", "./js/04-task-components.js", "./js/05-application.js", "./dashboard-v77.css", "./style.css"];
const rows=[];
(async()=>{for(const file of ASSETS){let success=false,reason='';try{const r=await fetch(file+'?diagnostic='+Date.now(),{cache:'no-store'});success=r.ok;reason='HTTP '+r.status;}catch(e){reason=String(e.message||e)} rows.push((success?'OK':'ERREUR')+' '+file+' : '+reason); const li=document.createElement('li');li.className=success?'ok':'fail';li.textContent=rows[rows.length-1];document.getElementById('results').append(li)}document.getElementById('status').textContent=rows.filter(x=>x.startsWith('OK')).length+'/'+rows.length+' fichiers accessibles';})();
document.getElementById('copy').addEventListener('click',()=>navigator.clipboard.writeText('Diagnostic PC V78.0 RC\n'+rows.join('\n')).catch(()=>prompt('Copier :',rows.join('\n'))));
</script></body></html>
